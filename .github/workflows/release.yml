name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.1.2 (the tag is created for you)'
        required: true

permissions:
  contents: write

jobs:
  # Creating the tag from the UI runs exactly the same script as `make release`
  # does locally, so a release cut from a browser cannot skip a check that one
  # cut from a terminal would have failed.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: cut the tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ inputs.version }}" sh scripts/release.sh

  release:
    needs: [tag]
    # Runs for a pushed tag too, where the job above is skipped rather than run.
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: build all targets
        run: |
          set -eu
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X main.version=${TAG} \
            -X main.commit=${COMMIT} \
            -X main.date=${DATE}"

          mkdir -p dist
          while read -r os arch; do
            [ -z "$os" ] && continue
            echo "==> $os/$arch"
            out="build/helikopter"
            [ "$os" = "windows" ] && out="build/helikopter.exe"
            rm -rf build && mkdir -p build

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/helikopter

            cp README.md LICENSE build/ 2>/dev/null || cp README.md build/
            name="helikopter_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd build && zip -q -r "../dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C build .
            fi
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux amd64
          linux arm64
          linux arm
          linux 386
          windows amd64
          windows arm64
          windows 386
          freebsd amd64
          TARGETS

          # Attached so a version can be installed by a script of the same age.
          # The copies on the website always track main, so these are stamped to
          # default to their own tag instead of to the latest release.
          sed "s|PINNED=\"\"|PINNED=\"${TAG}\"|"    install.sh  > dist/install.sh
          sed "s|Pinned = ''|Pinned = '${TAG}'|"   install.ps1 > dist/install.ps1
          grep -qF "PINNED=\"${TAG}\"" dist/install.sh  || { echo "install.sh was not stamped";  exit 1; }
          grep -qF "Pinned = '${TAG}'" dist/install.ps1 || { echo "install.ps1 was not stamped"; exit 1; }

          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # The package manifests are derived data: every value in them, including all
  # ten hashes, comes from the release that has just been published. Opening a
  # pull request to hand-land generated files after every tag is toil, so this
  # regenerates and commits them instead.
  packaging:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: regenerate manifests
        run: |
          set -eu
          TAG="${{ inputs.version || github.ref_name }}"
          packaging/bump.sh "$TAG"

      - name: commit if anything changed
        run: |
          set -eu
          TAG="${{ inputs.version || github.ref_name }}"
          if git diff --quiet -- packaging; then
            echo "manifests already match $TAG"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          git commit -m "Point the packaging manifests at $TAG

          Generated by packaging/bump.sh from the release's own checksums.txt."
          # main may have moved while the release was building.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
