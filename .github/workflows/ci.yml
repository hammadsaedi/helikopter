name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -race

      - name: smoke test
        shell: bash
        run: |
          go build -o hk ./cmd/helikopter
          ./hk --version
          ./hk --list-themes
          # Not a TTY here, so this takes the idle path and must still exit.
          ./hk --duration 2s --silence --no-awake

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build every target
        run: |
          while read -r os arch; do
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/helikopter
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux amd64
          linux arm64
          linux arm
          linux 386
          windows amd64
          windows arm64
          windows 386
          freebsd amd64
          TARGETS
