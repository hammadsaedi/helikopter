name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -race

      - name: smoke test
        shell: bash
        run: |
          go build -o hk ./cmd/helikopter
          ./hk --version
          ./hk --list-themes
          # Not a TTY here, so this takes the idle path and must still exit.
          ./hk --duration 2s --silence --no-awake

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build every target
        run: |
          while read -r os arch; do
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/helikopter
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux amd64
          linux arm64
          linux arm
          linux 386
          windows amd64
          windows arm64
          windows 386
          freebsd amd64
          TARGETS

  # The installers are how almost everyone will actually get this, and they are
  # the one part that cannot be exercised by `go test`. This runs them for real
  # against the latest published release, on every platform they claim to
  # support, and then runs what they installed.
  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: installers are unpinned on main
        shell: bash
        run: |
          set -eu
          # Only the copies attached to a release carry a tag. A stamped one
          # committed here would pin every new install to an old version.
          grep -qF 'PINNED=""'  install.sh  || { echo 'install.sh is stamped';  exit 1; }
          grep -qF "Pinned = ''" install.ps1 || { echo 'install.ps1 is stamped'; exit 1; }

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          export HELIKOPTER_BIN_DIR="$HOME/hkbin"
          sh ./install.sh
          "$HELIKOPTER_BIN_DIR/helikopter" --version
          "$HELIKOPTER_BIN_DIR/helikopter" --list-themes > /dev/null
          "$HELIKOPTER_BIN_DIR/helikopter" --duration 2s --silence --no-awake

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HELIKOPTER_BIN_DIR = "$env:USERPROFILE\hkbin"
          # Dot-sourced, because `irm | iex` also runs in the caller's scope:
          # the installer has to leave the command usable in *this* session.
          . ./install.ps1

          # Regression: SetEnvironmentVariable only writes the stored PATH, so
          # without updating $env:Path too this fails with "not recognized"
          # even though the install worked.
          helikopter --version
          helikopter --list-themes | Out-Null
          helikopter --duration 2s --silence --no-awake
